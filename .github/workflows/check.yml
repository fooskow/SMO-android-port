# Fork for the AYN Thor Max: a quick check on every push, without any game data. The launcher's Java is compiled
# against android.jar and the Android-only runtime sources are compiled (syntax and types) with the NDK's clang.
name: check
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;28.2.13676358" > /dev/null
      - name: Java (launcher)
        run: |
          mkdir -p /tmp/classes
          javac -source 11 -target 11 -encoding UTF-8 -Xlint:-options -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/classes $(find android/java -name '*.java')
      - name: C (Android runtime sources touched by the fork)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          GLUE="$NDK/sources/android/native_app_glue"
          for f in runtime/gfx_options.c runtime/android/android_perf.c runtime/android/android_main.c; do
            echo "== $f"
            "$CC" --target=aarch64-linux-android30 -fsyntax-only -D_GNU_SOURCE -Wall -Wno-unused -Werror=implicit-function-declaration \
              -Werror=incompatible-pointer-types -Werror=int-conversion -Iruntime -Iruntime/android -I"$GLUE" "$f"
          done
      - name: Python (extract from ExeFS)
        run: python3 -m py_compile tools/extract/from_exefs.py tools/android/android_env.py
